<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173c36"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="style.css"><title>موتوراه | مسیریاب موتور تهران</title>
<header><b><i>⌁</i> موتوراه</b><span>تهران <em>●</em></span></header>
<main><section class="panel"><small>مسیریاب موتورسیکلت</small><h1>کجا می‌ری؟</h1><p>مبدأ و مقصدت را انتخاب کن تا مسیر موتور را ببینی.</p>
<div class="fields"><label>مبدأ<select id="from" aria-label="مبدأ"></select></label><button id="swap" title="جابه‌جایی مبدأ و مقصد" aria-label="جابه‌جایی مبدأ و مقصد">⇅</button><label>مقصد<select id="to" aria-label="مقصد"></select></label></div>
<div class="tools"><button id="gps">◎ موقعیت من</button><button id="pickFrom">مبدأ روی نقشه</button><button id="pickTo">مقصد روی نقشه</button></div>
<label class="check"><input type="checkbox" id="highway" checked> ترجیح مسیرهای کم‌بزرگراه</label><button id="go">نمایش مسیر موتور</button>
<p id="status" role="status"></p><div id="result" hidden><strong id="stats"></strong><details><summary>راهنمای پیچ‌به‌پیچ</summary><ol id="steps"></ol></details></div>
<footer>مسیر بر اساس اطلاعات ثبت‌شده در نقشه است. محدودیت‌های محلی و تابلوهای مسیر را بررسی کن.</footer></section>
<section id="map" aria-label="نقشه تهران"><span id="mapmsg" hidden>نقشهٔ خیابان‌ها بارگیری نشد</span></section></main>
<script src="leaflet.min.js"></script><script src="app.js"></script></html>
